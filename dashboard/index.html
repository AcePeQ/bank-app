<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="/src/styles/reset.css" rel="stylesheet" />
  <link href="/src/styles/main.css" rel="stylesheet" />
  <link href="/src/styles/base.css" rel="stylesheet" />
  <link href="/src/styles/layout.css" rel="stylesheet" />
  <link href="/src/styles/components/header.css" rel="stylesheet" />
  <link href="/src/styles/components/sidebar.css" rel="stylesheet" />
  <link href="/src/styles/components/buttons.css" rel="stylesheet" />
  <link href="/src/styles/components/loader.css" rel="stylesheet" />
  <link href="/src/styles/pages/dashboard.css" rel="stylesheet" />

  <script src="/src/pages/dashboard.ts" defer type="module"></script>

  <title>Dashboard</title>
</head>

<body>
  <div class="base-layout grid-12">
    <header id="header" class="header"></header>

    <aside id="sidebar" class="sidebar"></aside>

    <main class="main">
      <div class="main-wrapper">
        <h1 class="sr-only">Dashbaord</h1>

        <section class="greeting">
          <hgroup>
            <time id="current-date" class="current-date">MONDAY, OCT 24</time>
            <h2 class="greeting__title">Hello, Maciej!</h2>
          </hgroup>
        </section>

        <section class="account-details">
          <hgroup>
            <h2 class="account-details__title">Total Balance</h2>
            <p class="account-details__balance">$142,850.00</p>
          </hgroup>

          <div class="month-spent-wrapper">
            <p class="month-spent">Spent this month <span class="month-spent-number">$4,320.15</span></p>
            <progress id="spent-progress-bar" class="month-spent-progress" max="432015" value="200000" />
          </div>
        </section>
      </div>
    </main>
  </div>
</body>

</html>
