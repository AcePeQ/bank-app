<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="/src/styles/reset.css" rel="stylesheet" />
  <link href="/src/styles/main.css" rel="stylesheet" />
  <link href="/src/styles/base.css" rel="stylesheet" />
  <link href="/src/styles/layout.css" rel="stylesheet" />
  <link href="/src/styles/components/header.css" rel="stylesheet" />
  <link href="/src/styles/components/sidebar.css" rel="stylesheet" />
  <link href="/src/styles/components/buttons.css" rel="stylesheet" />
  <link href="/src/styles/components/loader.css" rel="stylesheet" />
  <link href="/src/styles/components/account-card.css" rel="stylesheet" />
  <link href="/src/styles/components/transaction.css" rel="stylesheet" />
  <link href="/src/styles/pages/dashboard.css" rel="stylesheet" />

  <script src="/src/pages/dashboard.ts" defer type="module"></script>

  <title>Dashboard</title>
</head>

<body>
  <div class="base-layout grid-12">
    <header id="header" class="header"></header>

    <aside id="sidebar" class="sidebar"></aside>

    <main class="main">
      <div class="main-wrapper">
        <h1 class="sr-only">Dashbaord</h1>

        <section class="greeting">
          <hgroup>
            <time id="currentDate" class="current-date"></time>
            <h2 id="greeting" class="greeting__title"></h2>
          </hgroup>
        </section>

        <section class="account-dashbaord">
          <div class="account-details">
            <hgroup>
              <h2 class="account-details__title">Total Balance</h2>
              <p id="cardBalanceValue" class="account-details__balance"></p>
            </hgroup>

            <div class="month-spent-wrapper">
              <p class="month-spent">Spent this month <span id="monthSpendingValue" class="month-spent-number"></span>
              </p>
              <progress id="spentProgressBar" class="month-spent-progress" max="100" value="0"></progress>
            </div>
          </div>

          <div class="account-actions">
            <a class="account__action account__action--send" href="/transfers/send/">
              <div aria-hidden="true" class="account-action__icon-wrapper">
                <i data-lucide="send-horizontal"></i>
              </div>
              <span>Send</span>
            </a>

            <a class="account__action account__action--request" href="/transfers/request/">
              <div aria-hidden="true" class="account-action__icon-wrapper">
                <i data-lucide="banknote-arrow-up"></i>
              </div>
              <span>Request</span>
            </a>

            <a class="account__action account__action--pay" href="/transfers/pay/">
              <div aria-hidden="true" class="account-action__icon-wrapper">
                <i data-lucide="banknote-arrow-down"></i>
              </div>
              <span>Pay</span>
            </a>
          </div>
        </section>

        <div class="card-sections">
          <section class="card-section">
            <div class="card-section__header">
              <h2>My Card</h2>
              <a class="card-manage-link" href="/card/">
                Manage
                <i data-lucide="chevron-right"></i>
              </a>
            </div>

            <article id="cardItem" class="card"></article>
          </section>

          <section class="card-activity">
            <div class="card-activity__header">
              <h2>Recent Activity</h2>
              <a class="card-manage-link" href="/transactions/">
                View History
                <i data-lucide="chevron-right"></i>
              </a>
            </div>

            <ul id="recentActivityList" class="card-activity__list"></ul>
          </section>
        </div>

        <section class="month-spending-section">
          <h2>Monthly Spending</h2>
          <h3>Total: <span class="monthly-spending-total" id="monthlySpendingTotal">$4,271</span></h3>

          <div class="monthly-spending-chart">
            <canvas id="monthlySpendingCanvas"></canvas>
          </div>
        </section>
      </div>
    </main>
  </div>
</body>

</html>
