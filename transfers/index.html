<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="/src/styles/reset.css" rel="stylesheet">
  <link href="/src/styles/main.css" rel="stylesheet">
  <link href="/src/styles/base.css" rel="stylesheet">
  <link href="/src/styles/layout.css" rel="stylesheet">
  <link href="/src/styles/components/header.css" rel="stylesheet">
  <link href="/src/styles/components/search.css" rel="stylesheet">
  <link href="/src/styles/components/sidebar.css" rel="stylesheet">
  <link href="/src/styles/components/buttons.css" rel="stylesheet">
  <link href="/src/styles/components/loader.css" rel="stylesheet">
  <link href="/src/styles/pages/transfers.css" rel="stylesheet">

  <script src="/src/pages/transfers.ts" defer type="module"></script>

  <title>Transfers</title>
</head>

<body>
  <div class="base-layout grid-12">
    <header id="header" class="header"></header>
    <aside id="sidebar" class="sidebar"></aside>

    <main class="main">
      <div class="main-wrapper main-wrapper-transfers">
        <h1 class="sr-only">Transfers</h1>

        <section class="recipients" aria-labelledby="recentRecipientsTitle">
          <h2 id="recentRecipientsTitle" class="recipients__title">Recent Recipients</h2>
          <ul id="recentRecipientsList" class="recipients__list"></ul>
        </section>

        <section class="payments" aria-labelledby="newPaymentTitle">
          <h2 id="newPaymentTitle" class="payments__title">New Payment</h2>

          <ul class="payments__list">
            <li class="payments__item">
              <a class="payments__button" href="/transfers/bank-transfer/">
                <span class="payments__icon"><i data-lucide="landmark"></i></span>
                <span class="payment__details">
                  <span class="payment__title">Bank Transfer</span>
                  <span class="payment__subTitle">Send to any local bank account</span>
                </span>
                <i class="payments__chevron" data-lucide="chevron-right"></i>
              </a>
            </li>

            <li class="payments__item">
              <a class="payments__button" href="/transfers/pay-a-friend/">
                <span class="payments__icon"><i data-lucide="user"></i></span>
                <span class="payment__details">
                  <span class="payment__title">Pay a Friend</span>
                  <span class="payment__subTitle">Instant transfers to Infinity users</span>
                </span>
                <i class="payments__chevron" data-lucide="chevron-right"></i>
              </a>
            </li>

            <li class="payments__item">
              <a class="payments__button" href="/transfers/request-payment/">
                <span class="payments__icon"><i data-lucide="contact"></i></span>
                <span class="payment__details">
                  <span class="payment__title">Request Payment</span>
                  <span class="payment__subTitle">Request payment from Infinity users</span>
                </span>
                <i class="payments__chevron" data-lucide="chevron-right"></i>
              </a>
            </li>
          </ul>
        </section>
      </div>
    </main>
  </div>
</body>

</html>
