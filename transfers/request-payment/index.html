<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="/src/styles/reset.css" rel="stylesheet">
  <link href="/src/styles/main.css" rel="stylesheet">
  <link href="/src/styles/base.css" rel="stylesheet">
  <link href="/src/styles/layout.css" rel="stylesheet">
  <link href="/src/styles/components/header.css" rel="stylesheet">
  <link href="/src/styles/components/search.css" rel="stylesheet">
  <link href="/src/styles/components/sidebar.css" rel="stylesheet">
  <link href="/src/styles/components/buttons.css" rel="stylesheet">
  <link href="/src/styles/pages/transfer-form.css" rel="stylesheet">

  <script src="/src/pages/transfer-form.ts" defer type="module"></script>
  <title>Request Payment</title>
</head>

<body>
  <div class="base-layout grid-12">
    <header id="header" class="header"></header>
    <aside id="sidebar" class="sidebar"></aside>

    <main class="main">
      <div class="main-wrapper main-wrapper-transfer-form">
        <div class="transfer-page-header">
          <a class="transfer-page-header__back" href="/transfers/" aria-label="Back to transfers">
            <i data-lucide="arrow-left"></i>
          </a>
          <h1>Request Payment</h1>
        </div>

        <section class="transfer-form-card" aria-labelledby="requestPaymentFormTitle">
          <form id="requestPaymentForm" class="transfer-form">
            <p id="requestPaymentFormTitle" class="transfer-form__intro">
              Create a payment request for another Infinity user.
            </p>

            <fieldset class="transfer-form__fieldset">
              <legend>Find the payer by</legend>
              <div class="transfer-form__options">
                <label class="transfer-form__option">
                  <input type="radio" name="contactMethod" value="email" checked>
                  Email
                </label>
                <label class="transfer-form__option">
                  <input type="radio" name="contactMethod" value="phone">
                  Phone
                </label>
              </div>
            </fieldset>

            <div class="transfer-form__row">
              <label for="payerContact">Email or phone number</label>
              <input id="payerContact" name="payerContact" class="transfer-form__input" type="text"
                autocomplete="off" minlength="5" maxlength="254" placeholder="friend@example.com" required>
            </div>

            <div class="transfer-form__row">
              <label for="requestAmount">Amount</label>
              <div class="transfer-form__amount-wrapper">
                <span aria-hidden="true">$</span>
                <input id="requestAmount" name="amount" type="number" inputmode="decimal" min="0.01"
                  max="50000" step="0.01" placeholder="0.00" required>
              </div>
            </div>

            <div class="transfer-form__row">
              <label for="requestNote">Note <span class="transfer-form__hint">(optional)</span></label>
              <textarea id="requestNote" name="note" class="transfer-form__textarea" maxlength="140"
                placeholder="Dinner, tickets, shared bills..."></textarea>
            </div>

            <button class="btn btn--primary transfer-form__submit" type="submit">Send request</button>
          </form>
        </section>
      </div>
    </main>
  </div>
</body>

</html>
