<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="/src/styles/reset.css" rel="stylesheet">
  <link href="/src/styles/main.css" rel="stylesheet">
  <link href="/src/styles/base.css" rel="stylesheet">
  <link href="/src/styles/layout.css" rel="stylesheet">
  <link href="/src/styles/components/header.css" rel="stylesheet">
  <link href="/src/styles/components/search.css" rel="stylesheet">
  <link href="/src/styles/components/sidebar.css" rel="stylesheet">
  <link href="/src/styles/components/buttons.css" rel="stylesheet">
  <link href="/src/styles/pages/transfer-form.css" rel="stylesheet">

  <script src="/src/pages/transfer-form.ts" defer type="module"></script>
  <title>Bank Transfer</title>
</head>

<body>
  <div class="base-layout grid-12">
    <header id="header" class="header"></header>
    <aside id="sidebar" class="sidebar"></aside>

    <main class="main">
      <div class="main-wrapper main-wrapper-transfer-form">
        <div class="transfer-page-header">
          <a class="transfer-page-header__back" href="/transfers/" aria-label="Back to transfers">
            <i data-lucide="arrow-left"></i>
          </a>
          <h1>Bank Transfer</h1>
        </div>

        <section class="transfer-form-card" aria-labelledby="bankTransferFormTitle">
          <form id="bankTransferForm" class="transfer-form">
            <p id="bankTransferFormTitle" class="transfer-form__intro">
              Send money to a local or international bank account.
            </p>

            <div class="transfer-form__account">
              <div>
                <p class="transfer-form__account-label">From your main account</p>
                <p>•••• 4821</p>
              </div>
              <p class="transfer-form__balance">$15,524.12</p>
            </div>

            <div class="transfer-form__row">
              <label for="recipientName">Recipient name</label>
              <input id="recipientName" name="recipientName" class="transfer-form__input" type="text"
                autocomplete="name" minlength="2" maxlength="100" placeholder="John Smith" required>
            </div>

            <div class="transfer-form__row">
              <label for="accountNumber">Account number or IBAN</label>
              <input id="accountNumber" name="accountNumber" class="transfer-form__input" type="text"
                autocomplete="off" inputmode="text" minlength="8" maxlength="34" pattern="[A-Za-z0-9 ]{8,34}"
                placeholder="PL00 0000 0000 0000 0000 0000 0000" required>
              <p class="transfer-form__hint">Enter 8–34 letters or digits. Spaces are allowed.</p>
            </div>

            <div class="transfer-form__row">
              <label for="bankTransferAmount">Amount</label>
              <div class="transfer-form__amount-wrapper">
                <span aria-hidden="true">$</span>
                <input id="bankTransferAmount" name="amount" type="number" inputmode="decimal" min="0.01"
                  max="15524.12" step="0.01" placeholder="0.00" required>
              </div>
            </div>

            <div class="transfer-form__row">
              <label for="transferReference">Payment reference</label>
              <input id="transferReference" name="reference" class="transfer-form__input" type="text"
                minlength="2" maxlength="140" placeholder="Invoice 2026/08" required>
            </div>

            <button class="btn btn--primary transfer-form__submit" type="submit">Review transfer</button>
          </form>
        </section>
      </div>
    </main>
  </div>
</body>

</html>
