<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="/src/styles/reset.css" rel="stylesheet" />
  <link href="/src/styles/main.css" rel="stylesheet" />
  <link href="/src/styles/base.css" rel="stylesheet" />
  <link href="/src/styles/layout.css" rel="stylesheet" />
  <link href="/src/styles/components/header.css" rel="stylesheet" />
  <link href="/src/styles/components/search.css" rel="stylesheet" />
  <link href="/src/styles/components/sidebar.css" rel="stylesheet" />
  <link href="/src/styles/components/buttons.css" rel="stylesheet" />
  <link href="/src/styles/components/loader.css" rel="stylesheet" />
  <link href="/src/styles/components/account-card.css" rel="stylesheet" />
  <link href="/src/styles/pages/card.css" rel="stylesheet" />

  <script src="/src/pages/card.ts" defer type="module"></script>

  <title>Card</title>
</head>

<body>
  <div class="base-layout grid-12">
    <header id="header" class="header"></header>

    <aside id="sidebar" class="sidebar"></aside>

    <main class="main">
      <div class="main-wrapper">
        <h1 class="sr-only">My card</h1>

        <div class="card-wrapper">
          <div id="cardContainer"></div>

          <ul class="card-actions">
            <li class="card-action">
              <button class="card-action__button">
                <div class="card-action__button__icon-wrapper">
                  <i data-lucide="eye"></i>
                </div>
                Freeze Card
              </button>
            </li>

            <li class="card-action">
              <button class="card-action__button">
                <div class="card-action__button__icon-wrapper">
                  <i data-lucide="eye"></i>
                </div>
                Show PIN
              </button>
            </li>

            <li class="card-action">
              <button class="card-action__button">
                <div class="card-action__button__icon-wrapper">
                  <i data-lucide="eye"></i>
                </div>
                Replace Card
              </button>
            </li>
          </ul>
        </div>

        <section class="section-settings">
          <h2>Card Settings</h2>

          <div class="card-settings"></div>
        </section>
      </div>
    </main>
  </div>
</body>

</html>
