<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="/src/styles/reset.css" rel="stylesheet" />
  <link href="/src/styles/main.css" rel="stylesheet" />
  <link href="/src/styles/base.css" rel="stylesheet" />
  <link href="/src/styles/layout.css" rel="stylesheet" />
  <link href="/src/styles/components/header.css" rel="stylesheet" />
  <link href="/src/styles/components/search.css" rel="stylesheet" />
  <link href="/src/styles/components/sidebar.css" rel="stylesheet" />
  <link href="/src/styles/components/buttons.css" rel="stylesheet" />
  <link href="/src/styles/components/loader.css" rel="stylesheet" />
  <link href="/src/styles/components/toggleSwitch.css" rel="stylesheet" />
  <link href="/src/styles/components/account-card.css" rel="stylesheet" />
  <link href="/src/styles/pages/card.css" rel="stylesheet" />

  <script src="/src/pages/card.ts" defer type="module"></script>

  <title>Card</title>
</head>

<body>
  <div class="base-layout grid-12">
    <header id="header" class="header"></header>

    <aside id="sidebar" class="sidebar"></aside>

    <main class="main">
      <div class="main-wrapper">
        <h1 class="sr-only">My card</h1>

        <div class="card-wrapper">
          <div id="cardContainer" class="card-container"></div>

          <ul class="card-actions">
            <li class="card-action">
              <button class="card-action__button">
                <div class="card-action__button__icon-wrapper">
                  <i data-lucide="snowflake"></i>
                </div>
                Freeze Card
              </button>
            </li>

            <li class="card-action">
              <button class="card-action__button">
                <div class="card-action__button__icon-wrapper">
                  <i data-lucide="eye"></i>
                </div>
                Show PIN
              </button>
            </li>

            <li class="card-action">
              <button class="card-action__button">
                <div class="card-action__button__icon-wrapper">
                  <i data-lucide="square-arrow-right-enter"></i>
                </div>
                Replace Card
              </button>
            </li>
          </ul>
        </div>

        <section class="section-settings">
          <h2>Card Settings</h2>

          <div class="card-settings">
            <ul>
              <li>
                <div class="card-settings__icon">
                  <i data-lucide="shopping-cart"></i>
                </div>
                <hgroup class="card-settings__title-group">
                  <h3 class="card-settings__title">Online Payments</h3>
                  <p class="card-settings__subtitle">Enable for web transactions</p>
                </hgroup>
                <div id="cardSettingsOnlinePayments" class="card-settings__action"></div>
              </li>
              <li>
                <div class="card-settings__icon">
                  <i data-lucide="landmark"></i>
                </div>
                <hgroup class="card-settings__title-group">
                  <h3 class="card-settings__title">ATM Withdrawals</h3>
                  <p class="card-settings__subtitle">Allow cash withdrawals</p>
                </hgroup>
                <div id="cardSettingsAtmWithdrawals" class="card-settings__action"></div>
              </li>
            </ul>

            <span aria-hidden="true" class="separator-line"></span>

            <ul>
              <li>
                <div class="card-settings__icon">
                  <i data-lucide="gauge"></i>
                </div>
                <hgroup class="card-settings__title-group">
                  <h3 class="card-settings__title">Daily Spending Limit</h3>
                  <p class="card-settings__subtitle">Max daily transaction amount</p>
                </hgroup>
                <div class="card-settings__action">
                  $2,500,00
                </div>
              </li>
              <li>
                <div class="card-settings__icon">
                  <i data-lucide="hand-coins"></i>
                </div>
                <hgroup class="card-settings__title-group">
                  <h3 class="card-settings__title">Single Payment Limit</h3>
                  <p class="card-settings__subtitle">Max per single transaction</p>
                </hgroup>
                <div class="card-settings__action">
                  $1,500,00
                </div>
              </li>
            </ul>
          </div>
        </section>
      </div>
    </main>
  </div>
</body>

</html>
